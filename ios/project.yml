name: TrueSolarTime

options:
  bundleIdPrefix: com.realsuntime
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""

targets:
  TrueSolarTime:
    type: application
    platform: iOS
    sources:
      - path: TrueSolarTime
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.realsuntime.solartime
        PRODUCT_NAME: TrueSolarTime
        MARKETING_VERSION: "1.2"
        CURRENT_PROJECT_VERSION: "5"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 真太阳时
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: 用于获取你所在位置的经纬度，以计算当地真太阳时
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleDefault
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ENABLE_USER_SCRIPT_SANDBOXING: YES
      configs:
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"

schemes:
  TrueSolarTime:
    build:
      targets:
        TrueSolarTime: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
