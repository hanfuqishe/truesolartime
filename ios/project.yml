name: TrueSolarTime

options:
  bundleIdPrefix: com.realsuntime
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top
  # 开发语言（兜底语言）用英文：系统语言既不是简体也不是繁體时按英文显示。
  # 三语 .lproj 放在 TrueSolarTime/Resources/<lang>.lproj 下，XcodeGen 会把它们识别成
  # 「本地化资源（variant group）」并把 en / zh-Hans / zh-Hant 写进 project.pbxproj 的
  # knownRegions，不需要再单独声明 resources（也不用在这里列语言）。
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""

targets:
  TrueSolarTime:
    type: application
    platform: iOS
    sources:
      - path: TrueSolarTime
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.realsuntime.solartime
        PRODUCT_NAME: TrueSolarTime
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "46"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        # 首页标题、设置项、权限说明等全部走三语 strings；Info.plist 里这两条文案的
        # 各语言版本放在 Resources/<lang>.lproj/InfoPlist.strings（系统按语言取用），
        # 这里写的是兜底（英文）值。
        INFOPLIST_KEY_CFBundleDisplayName: True Solar Clock
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Used to get your coordinates so the app can compute local true solar time.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        # 只用系统提供的 HTTPS（URLSession），属于豁免加密：声明后 TestFlight 不再问「加密文稿」
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleDefault
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ENABLE_USER_SCRIPT_SANDBOXING: YES
      configs:
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"

schemes:
  TrueSolarTime:
    build:
      targets:
        TrueSolarTime: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
