name: iOS TestFlight

# 有付费开发者账号后的正式出包流程：自动签名 → archive → 导出 ipa → 上传 TestFlight。
# 需要三个仓库 secret（Settings → Secrets and variables → Actions）：
#   APPSTORE_KEY_ID         App Store Connect API 的 Key ID
#   APPSTORE_ISSUER_ID      Issuer ID
#   APPSTORE_PRIVATE_KEY    AuthKey_XXXX.p8 的完整内容
# 手动触发即可；上传成功后到 App Store Connect → TestFlight 处理构建。

on:
  workflow_dispatch:
    inputs:
      changelog:
        description: 'TestFlight 里显示的构建说明（可留空）'
        required: false
        default: ''

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: 显示工具链
        run: |
          xcodebuild -version
          swift --version

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 由 project.yml 生成工程
        working-directory: ios
        run: xcodegen generate

      - name: 准备 API Key
        env:
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
        run: |
          mkdir -p ~/private_keys
          printf '%s' "$APPSTORE_PRIVATE_KEY" > ~/private_keys/AuthKey_"$APPSTORE_KEY_ID".p8
          chmod 600 ~/private_keys/AuthKey_"$APPSTORE_KEY_ID".p8

      - name: Archive（自动签名）
        working-directory: ios
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_TEAM_ID" ]; then
            echo "::error::缺少仓库变量 APPLE_TEAM_ID（开发者后台 Membership 里的 Team ID）"
            exit 1
          fi
          xcodebuild archive \
            -project TrueSolarTime.xcodeproj \
            -scheme TrueSolarTime \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/TrueSolarTime.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_"$APPSTORE_KEY_ID".p8 \
            -authenticationKeyID "$APPSTORE_KEY_ID" \
            -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID" \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID"

      - name: 导出 ipa（app-store-connect）
        working-directory: ios
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>uploadSymbols</key>
            <true/>
            <key>destination</key>
            <string>export</string>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/TrueSolarTime.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_"$APPSTORE_KEY_ID".p8 \
            -authenticationKeyID "$APPSTORE_KEY_ID" \
            -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID"

      - name: 上传到 TestFlight
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          CHANGELOG: ${{ github.event.inputs.changelog }}
        run: |
          IPA=$(ls "$RUNNER_TEMP"/export/*.ipa | head -n 1)
          echo "上传 $IPA"
          echo "构建说明（请在 TestFlight 页面填写）：$CHANGELOG"
          # altool 用于上传构建到 App Store Connect（不支持 --whats-new，
          # 「此版本的新增内容」在 TestFlight / 版本信息页填）
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$APPSTORE_KEY_ID" --apiIssuer "$APPSTORE_ISSUER_ID" 2>&1 | tail -n 40

      - name: 保留 ipa 备查
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TrueSolarTime-export-ipa
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: warn
