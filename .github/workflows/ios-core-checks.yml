name: iOS Core 数值自检

# 手动触发，或在改到 iOS Core/脚本时跑一次。
# 只用 `swiftc` 编译 Core + Scripts/main.swift，不需要 Xcode、也不打包，几十秒就能出结果。
on:
  workflow_dispatch:
  push:
    paths:
      - 'ios/TrueSolarTime/Core/**'
      - 'ios/Scripts/**'
      - '.github/workflows/ios-core-checks.yml'

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: 工具链
        run: |
          swift --version
          xcodebuild -version

      - name: 编译并运行数值自检
        working-directory: ios
        run: bash Scripts/verify.sh 2>&1 | tee verify.log

      - name: 结果摘要
        if: always()
        working-directory: ios
        run: |
          echo "---- 失败项（如有） ----"
          grep -E "^  ✗|✗ " verify.log || echo "（无失败项）"
          echo "---- 末尾 ----"
          tail -5 verify.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-verify-log
          path: ios/verify.log
          retention-days: 14
